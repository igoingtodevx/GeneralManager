name: ci

on:
  push:
    branches: ["main", "feat/general-manager-os"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check core.js && node --check app.js
      - name: Core tests
        run: npm test
